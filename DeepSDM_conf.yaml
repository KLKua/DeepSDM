# configurations of pytorch lightning and model checkpoints
earlystopping_conf:
  min_delta: 0.0
  mode: max
  monitor: f1_train
  patience: 50
  verbose: true
model_checkpoint_conf:
  mode: max
  monitor: f1_train
  save_last: true
  save_top_k: 3
  verbose: true
trainer_conf:
  accelerator: gpu
  check_val_every_n_epoch: 1
  devices: 2
  precision: 32

# spatial and temporal configurations
spatial_conf_tmp:
  grid_size: 60
  num_of_grid_x: 26
  num_of_grid_y: 18
  out_res: 0.02
  x_start: 122.85
  y_start: 24
temporal_conf:
  cooccurrence_day_limit: 14
  date_end: '2021-12-31'
  date_start: '2002-01-01'
  month_span: 3
  month_step: 1


# data preparation configurations
file_make_extent: ./workspace/extent_binaryJapKor.tif
gbif_occurrence_csv: ./raw/gbif_1000monitoring_merged.csv

